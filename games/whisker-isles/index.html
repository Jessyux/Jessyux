<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisker Isles</title>
<meta name="description" content="A cosy cat board game for 2 to 10 players. Build cat beds, roll out yarn paths and keep away from the Vacuum.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M18 44 26 8 48 28Z M82 44 74 8 52 28Z' fill='%23FF8A3D' stroke='%233A2341' stroke-width='5' stroke-linejoin='round'/%3E%3Cellipse cx='50' cy='60' rx='40' ry='33' fill='%23FFB067' stroke='%233A2341' stroke-width='5'/%3E%3Ccircle cx='35' cy='60' r='7' fill='%233A2341'/%3E%3Ccircle cx='65' cy='60' r='7' fill='%233A2341'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#3A2341;      /* outlines and text */
  --plum-2:#6B4F73;    /* secondary text */
  --sakura:#FFEFF4;    /* page */
  --milk:#FFFFFF;      /* cards */
  --sea:#C7BDF7;       /* lavender dream sea */
  --sea-2:#AFA2EE;
  --strawberry:#F2607F;/* hot numbers, alerts */
  --butter:#FFD36E;    /* highlights, current turn */
  --mint:#8EDFC0;
  --r-sm:10px; --r-md:16px; --r-lg:26px;
  --sticker: 3px 3px 0 var(--plum);
  --display:"Mochiy Pop One", "Zen Maru Gothic", system-ui, sans-serif;
  --body:"Zen Maru Gothic", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body); font-weight:500; color:var(--plum);
  background-color:var(--sakura);
  background-image:radial-gradient(#F9D3E0 1.6px, transparent 1.7px);
  background-size:22px 22px;
  min-height:100vh; line-height:1.45;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--strawberry);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15}

/* ---------- buttons ---------- */
.btn{
  border:3px solid var(--plum); background:var(--milk); border-radius:999px;
  padding:.5em 1.05em; font-weight:700; box-shadow:var(--sticker);
  transition:transform .08s, box-shadow .08s; display:inline-flex; align-items:center; gap:.45em; justify-content:center;
}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--plum)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--plum)}
.btn:disabled{opacity:.42;box-shadow:none}
.btn.primary{background:var(--butter)}
.btn.hot{background:var(--strawberry);color:#fff}
.btn.small{padding:.3em .75em;font-size:.88rem;border-width:2.5px;box-shadow:2px 2px 0 var(--plum)}
.btn.block{width:100%}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;max-width:1360px;margin:0 auto;padding:16px 20px 32px}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-size:1.7rem;display:flex;align-items:center;gap:.4em}
.wordmark svg{width:38px;height:38px}
.wordmark .logo-img{height:58px;width:auto;display:block;filter:drop-shadow(2px 2px 0 rgba(58,35,65,.18))}
.topbar .tools{display:flex;gap:8px;flex-wrap:wrap}
.board-wrap{position:relative;min-width:0}
#board{width:100%;height:auto;display:block;max-height:max(340px, calc(100vh - 372px))}
.board-wrap{display:flex;flex-direction:column;gap:12px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:0 8px 8px 0;align-self:start}
/* soft lavender pill scrollbars, so the side panel and log scroll without a grey OS bar */
.panel,.log{scrollbar-width:thin;scrollbar-color:#D9C8F2 transparent}
.panel::-webkit-scrollbar,.log::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-track,.log::-webkit-scrollbar-track{background:transparent;margin:10px}
.panel::-webkit-scrollbar-thumb,.log::-webkit-scrollbar-thumb{background:#D9C8F2;border-radius:999px;border:2px solid transparent;background-clip:padding-box}
.panel::-webkit-scrollbar-thumb:hover,.log::-webkit-scrollbar-thumb:hover{background:#B9A2E6;background-clip:padding-box}
.panel:hover,.log:hover{scrollbar-color:#B9A2E6 transparent}
.card{background:var(--milk);border:3px solid var(--plum);border-radius:var(--r-lg);box-shadow:4px 4px 0 var(--plum);padding:14px 16px}
.card h3{font-size:1.02rem;margin-bottom:8px}
@media (max-width: 920px){
  .app{grid-template-columns:1fr;padding:12px 16px 28px}
  #board{max-height:none}
  .panel{position:static;max-height:none;overflow:visible}
}

/* ---------- turn card ---------- */
.turn{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.portrait{width:76px;height:76px;border-radius:50%;border:3px solid var(--plum);overflow:hidden;display:grid;place-items:center;background:color-mix(in srgb, var(--pc,#eee) 28%, #fff);flex:none}
.portrait img,.portrait svg{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.turn .who{font-family:var(--display);font-size:1.35rem}
.turn .sub{color:var(--plum-2);font-size:.92rem}
.hint{margin-top:10px;background:#FFF7DA;border:2.5px dashed var(--plum);border-radius:var(--r-md);padding:8px 12px;font-weight:700;font-size:.95rem}
.hint.alert{background:#FFE0E7;border-style:solid;border-color:var(--strawberry)}

/* ---------- dice ---------- */
.dice-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.die{width:52px;height:52px;background:var(--milk);border:3px solid var(--plum);border-radius:14px;box-shadow:var(--sticker);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px}
.die i{width:9px;height:9px;border-radius:50%;background:var(--plum);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.seven i.on{background:var(--strawberry)}
.die.rolling{animation:shake .45s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) translateY(-4px)}50%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
.sum{font-family:var(--display);font-size:1.8rem;min-width:2ch}
.dice-row .btn{margin-left:auto}

/* ---------- hand ---------- */
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.res{border:2.5px solid var(--plum);border-radius:var(--r-md);padding:6px 4px 4px;text-align:center;background:var(--tile)}
.res .ic{width:34px;height:34px;margin:0 auto;display:block}
.res .ic img{width:100%;height:100%;object-fit:contain}
.res b{font-family:var(--display);font-weight:400;font-size:1.15rem;display:block}
.res span{font-size:.72rem;font-weight:700;display:block}
.res.zero{opacity:.45}
.res.flash{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.15)}}

/* ---------- build menu ---------- */
.builds{display:grid;gap:8px}
.build{display:flex;align-items:center;gap:10px;border:2.5px solid var(--plum);border-radius:var(--r-md);padding:7px 10px;background:var(--milk);text-align:left;box-shadow:2px 2px 0 var(--plum)}
.build:hover:not(:disabled){background:#FFF7DA}
.build:disabled{opacity:.45;box-shadow:none}
.build.active{background:var(--butter)}
.build .nm{font-weight:900;flex:1}
.build .nm small{display:block;font-weight:500;color:var(--plum-2);font-size:.78rem}
.cost{display:flex;gap:2px}
.cost .ic{width:22px;height:22px}
.cost .ic img{width:100%;height:100%;object-fit:contain}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}

/* ---------- treats ---------- */
.treats{display:flex;gap:8px;flex-wrap:wrap}
.treat{width:84px;border:2.5px solid var(--plum);border-radius:var(--r-md);background:#FFF7DA;padding:6px;text-align:center;font-size:.76rem;font-weight:900;box-shadow:2px 2px 0 var(--plum)}
.treat .ic{width:44px;height:44px;margin:0 auto 2px;display:block}
.treat .ic img{width:100%;height:100%;object-fit:contain}
.treat:disabled{opacity:.5;box-shadow:none}
.treat.new{background:#EEE}
.empty{color:var(--plum-2);font-size:.9rem}

/* ---------- players ---------- */
.players{display:grid;gap:4px}
.cats-card{padding:10px 12px}
.cats-card h3{margin-bottom:4px}
.pl{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:var(--r-md);border:2.5px solid transparent}
.pl.cur{border-color:var(--plum);background:#FFF7DA}
.pl .portrait{width:44px;height:44px;border-width:2.5px}
.pl .nm{font-weight:900}
.pl .meta{font-size:.8rem;color:var(--plum-2)}
.pl .vp{font-family:var(--display);font-size:1.4rem;text-align:right}
.pl .vp small{display:block;font-family:var(--body);font-size:.7rem;font-weight:700;color:var(--plum-2)}
.badge{display:inline-block;font-size:.7rem;font-weight:900;border:2px solid var(--plum);border-radius:999px;padding:0 .5em;margin-left:4px;background:var(--mint)}

/* ---------- odds chart ---------- */
.odds svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--plum-2);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1.5px solid var(--plum)}

/* ---------- log ---------- */
.log{max-height:170px;overflow:auto;font-size:.86rem;display:grid;gap:3px;margin:0;padding:0;list-style:none}
.log li{padding:2px 0;border-bottom:1.5px dotted #E6D3E9}
details summary{cursor:pointer;font-family:var(--display);font-size:1.02rem;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";float:right}
details[open] summary::after{content:"–"}
details[open] summary{margin-bottom:8px}

/* ---------- board ---------- */
.hot-v{cursor:pointer}
.hot-v circle{fill:var(--butter);stroke:var(--plum);stroke-width:3;animation:pulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.hot-v:hover circle,.hot-v:focus circle{fill:#fff}
.hot-e{cursor:pointer}
.hot-e line.show{stroke:var(--butter);stroke-width:10;stroke-linecap:round;stroke-dasharray:2 12;animation:dash 1s linear infinite}
.hot-e:hover line.show,.hot-e:focus line.show{stroke:#fff;stroke-dasharray:none}
.hot-h{cursor:pointer}
.hot-h polygon{fill:rgba(255,211,110,.35);stroke:var(--plum);stroke-width:4;stroke-dasharray:8 6}
.hot-h:hover polygon,.hot-h:focus polygon{fill:rgba(242,96,127,.35)}
svg :focus{outline:none}
@keyframes pulse{50%{transform:scale(1.25)}}
@keyframes dash{to{stroke-dashoffset:-28}}
.vac-bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(58,35,65,.55);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal{background:var(--milk);border:3px solid var(--plum);border-radius:30px;box-shadow:6px 6px 0 var(--plum);padding:22px 22px 20px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal h2{font-size:1.5rem;margin-bottom:6px}
.modal p{margin:.3em 0 .8em}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.handoff{text-align:center}
.handoff .portrait{width:150px;height:150px;margin:0 auto 12px;border-width:4px}
.steppers{display:grid;gap:8px}
.stepper{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:2.5px solid var(--plum);border-radius:var(--r-md);padding:5px 8px;background:var(--tile)}
.stepper .ic{width:32px;height:32px}
.stepper .ic img{width:100%;height:100%;object-fit:contain}
.stepper .ctrl{display:flex;align-items:center;gap:8px}
.stepper .ctrl b{font-family:var(--display);font-weight:400;min-width:1.6ch;text-align:center;font-size:1.15rem}
.stepper .ctrl button{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--plum);background:#fff;font-weight:900;padding:0}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pick button{border:2.5px solid var(--plum);border-radius:var(--r-md);background:var(--tile);padding:8px 2px;font-weight:900;font-size:.76rem}
.pick button .ic{width:34px;height:34px;display:block;margin:0 auto 2px}
.pick button .ic img{width:100%;height:100%;object-fit:contain}
.pick button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--butter),0 0 0 6px var(--plum)}
.pick button:disabled{opacity:.35}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.cols{grid-template-columns:1fr}.pick{grid-template-columns:repeat(3,1fr)}}
.sec-label{font-weight:900;margin:10px 0 6px}
.partner{display:flex;gap:8px;flex-wrap:wrap}
.partner button{display:flex;align-items:center;gap:6px;border:2.5px solid var(--plum);border-radius:999px;background:#fff;padding:3px 12px 3px 3px;font-weight:900}
.partner button .portrait{width:30px;height:30px;border-width:2px}
.partner button[aria-pressed="true"]{background:var(--butter)}
.modal.rules{width:min(780px,100%);padding-top:0}
.rules-head{position:sticky;top:0;background:var(--milk);display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px;z-index:1;border-bottom:2.5px dotted #E6D3E9}
.rules .lead{font-size:1.02rem;margin:12px 0 4px}
.rules .small{font-size:.9rem;color:var(--plum-2);margin:8px 0 0}
.rule-block{border-top:2.5px dotted #E6D3E9;padding:14px 0 6px}
.rule-block h3{font-size:1.12rem;margin:0 0 10px}
.rules ul{margin:0;padding-left:1.2em}
.rules li{margin:.2em 0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:st}
.steps li{display:grid;grid-template-columns:28px 92px 1fr;gap:10px;align-items:center;counter-increment:st;background:#FFF7DA;border:2px solid var(--plum);border-radius:var(--r-md);padding:6px 10px}
.steps li::before{content:counter(st);font-family:var(--display);width:26px;height:26px;border-radius:50%;background:var(--butter);border:2px solid var(--plum);display:grid;place-items:center;font-size:.85rem}
.step-pic{display:flex;align-items:center;justify-content:center;gap:2px}
.pill{font-weight:900;font-size:.8rem;border:2px solid var(--plum);border-radius:999px;padding:.15em .7em;background:#fff}
.mini-dice{display:flex;gap:4px}
.mini-dice .die{width:30px;height:30px;padding:3px;border-width:2px;border-radius:8px;box-shadow:none}
.mini-dice .die i{width:5px;height:5px}
.res-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.res-item{display:grid;justify-items:center;text-align:center;gap:2px}
.res-item small,.bcard small,.tcard small,.dock small{color:var(--plum-2);font-size:.76rem;line-height:1.3}
.tile-thumb{width:64px;height:74px;object-fit:contain;display:block}
.build-grid,.treat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.treat-grid{grid-template-columns:repeat(5,1fr)}
.bcard,.tcard{border:2.5px solid var(--plum);border-radius:var(--r-md);padding:10px 8px;display:grid;justify-items:center;text-align:center;gap:4px;background:#fff;align-content:start}
.tcard{background:#FFF7DA}
.bcard > svg,.bcard > .ic{height:44px;width:auto}
.bcard{min-width:0}
.bcard .cost{flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%;margin-top:auto}
.bcard .cost .ic{width:20px;height:20px}
.award-card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:2.5px solid var(--plum);border-radius:var(--r-md);padding:10px 14px;background:linear-gradient(135deg,#E9FBF3,#fff)}
.award-card.zoom{background:linear-gradient(135deg,#FFF4D1,#fff)}
.award-card b{font-family:var(--display);font-weight:400;font-size:1.05rem;display:block}
.award-card .plus{display:inline-block;font-weight:900;font-size:.78rem;border:2px solid var(--plum);border-radius:999px;padding:0 .6em;background:#fff;margin:3px 0 4px}
.award-card small{display:block}
.award-card .award{animation:awardBob 3s ease-in-out infinite;transform-origin:50% 40%}
@keyframes awardBob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-2px)}}
.award .shine{animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,55%{transform:skewX(-20deg) translateX(0)}85%,100%{transform:skewX(-20deg) translateX(64px)}}
.award-chip{display:inline-flex;align-items:center;gap:3px;font-size:.7rem;font-weight:900;border:2px solid var(--plum);border-radius:999px;padding:0 .55em 0 .15em;margin-left:4px;background:#fff;vertical-align:middle}
.award-chip .award{margin:-4px 0}
/* roll panel under the board */
.rollbar{padding:0;overflow:hidden}
/* turn strip runs edge to edge across the top of the panel */
.rb-turn{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;border-bottom:2.5px solid var(--plum)}
.rb-turn .turn{grid-template-columns:52px auto;gap:10px;flex:none}
.rb-turn .portrait{width:52px;height:52px}
.rb-turn .turn .who{font-size:1.15rem}
.rb-turn .turn .sub{font-size:.84rem}
.rb-turn .hint{margin:0;flex:1 1 260px;font-size:.88rem;padding:6px 12px}
.rb-cols{display:grid;grid-template-columns:minmax(150px,.75fr) minmax(190px,1fr) minmax(210px,1.25fr);gap:16px;align-items:start;padding:12px 16px}
.rollbar h3{font-size:.98rem;margin:0 0 6px}
.rb-dice .dice-row{gap:8px}
.rb-last{font-size:.84rem;color:var(--plum-2);margin:6px 0 8px;font-weight:700}
.rb-odds svg{width:100%;height:auto;max-height:96px;display:block}
.rb-log .log{max-height:120px}
@media (max-width:1100px){.rb-cols{grid-template-columns:1fr 1fr}.rb-log{grid-column:1/-1}}
@media (max-width:560px){.rb-cols{grid-template-columns:1fr}}
/* dice landing: matching tiles light up, cards fly to cats */
.hl-tile{fill:rgba(255,227,122,.28);stroke:#FFD36E;stroke-width:7;stroke-linejoin:round;animation:hlPulse .7s ease-in-out 3}
.hl-blocked{fill:rgba(58,35,65,.25);stroke:#F2607F;stroke-width:5;stroke-dasharray:10 7}
@keyframes hlPulse{50%{stroke-width:12;fill:rgba(255,227,122,.5)}}
.hl-token{animation:tokenPop .7s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes tokenPop{40%{transform:scale(1.35)}}
.fly{position:fixed;width:36px;height:36px;z-index:30;pointer-events:none;filter:drop-shadow(2px 2px 0 rgba(58,35,65,.35))}
.fly .ic,.fly svg{width:36px;height:36px}
.pl.got .portrait{animation:gotIt .45s ease-out}
@keyframes gotIt{40%{transform:scale(1.18) rotate(-6deg)}}
.split{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.split-pic img,.split-pic svg{width:110px;height:110px;object-fit:contain;display:block}
.trade-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.dock{display:grid;justify-items:start;gap:6px;border:2px solid var(--plum);border-radius:var(--r-md);padding:8px 10px}
.dock-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);border:2.5px solid var(--plum);border-radius:999px;padding:.15em .7em;background:#fff}
.dock-badge em{font-style:normal}
.setup-note{font-size:.86rem;color:var(--plum-2);margin:-2px 0 8px}
.build.idle{opacity:.55;box-shadow:none}
div.build{cursor:default}
@media (max-width:640px){
  .res-grid{grid-template-columns:repeat(3,1fr)}
  .build-grid{grid-template-columns:repeat(2,1fr)}
  .treat-grid{grid-template-columns:repeat(2,1fr)}
  .steps li{grid-template-columns:26px 1fr}
  .step-pic{display:none}
  .split{grid-template-columns:70px 1fr}
  .split-pic img,.split-pic svg{width:70px;height:70px}
}

/* ---------- win ---------- */
.win .portrait{width:170px;height:170px;margin:0 auto 10px;border-width:4px}
.scores{display:grid;gap:6px;margin-top:10px;text-align:left}
.scores div{display:flex;justify-content:space-between;border-bottom:2px dotted #E6D3E9;padding:3px 0}


/* ---------- additions: online, lobby, expansion ---------- */
.ic{display:inline-block;flex:none}
.ic img{width:100%;height:100%;object-fit:contain;display:block}
.build > .ic{width:30px;height:30px}
.start{max-width:1080px;margin:0 auto;padding:24px 16px 40px}
.muted{color:var(--plum-2);font-weight:500}
.center{text-align:center;justify-content:center}
.actions.center{justify-content:center}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--plum);margin-right:5px;vertical-align:-1px}
.code-chip{border:2.5px dashed var(--plum);border-radius:999px;padding:.25em .8em;font-size:.88rem;background:#fff;align-self:center}
.code-chip b{font-family:var(--display);font-weight:400}
.turn-card{background:linear-gradient(color-mix(in srgb, var(--pc) 14%, transparent),color-mix(in srgb, var(--pc) 14%, transparent)),#fff}
.hit{fill:transparent;stroke:none;animation:none!important}
.big-ic{display:grid;place-items:center;margin:0 auto 6px}
.big-ic img{width:100%;height:100%;object-fit:contain}
.modal.wide{width:min(680px,100%)}
.hero{display:grid;place-items:center;text-align:center;padding:0}
.hero-art{width:min(720px,100%);aspect-ratio:1024/640;object-fit:cover;border:3px solid var(--plum);border-radius:30px;box-shadow:5px 5px 0 var(--plum);display:block}
.hero-art.fallback{display:flex;justify-content:center;align-items:flex-end;gap:4px;background:var(--sea);padding:20px}
.hero-art.fallback span{width:22%}
.hero-frame{position:relative;width:min(720px,100%)}
.hero-frame h1{position:absolute;left:0;right:0;top:7%;font-size:clamp(2.2rem,8vw,4.4rem);color:#fff;letter-spacing:.01em;text-shadow:3px 3px 0 var(--plum),-2px -2px 0 var(--plum),2px -2px 0 var(--plum),-2px 2px 0 var(--plum),5px 6px 0 var(--plum)}
.hero-frame h1.logo-h1{top:1.5%;left:16%;right:16%;text-shadow:none}
.logo-h1 img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 0 rgba(58,35,65,.25))}
.hero > p{font-size:1.05rem;margin:14px auto 0;max-width:52ch;font-weight:700}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
@media (max-width:820px){.modes{grid-template-columns:1fr}}
.mode h2{font-size:1.3rem}
.mode > p{margin:.25em 0 .8em}
.field{display:block;font-weight:900;margin:10px 0 6px}
.field input,.join input{display:block;width:100%;font:inherit;font-weight:700;border:2.5px solid var(--plum);border-radius:999px;padding:.45em .9em;background:#FFF7DA;color:var(--plum);margin-top:6px}
.breeds{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,58px));gap:8px}
.breeds button{aspect-ratio:1;border-radius:50%;border:2.5px solid var(--plum);background:color-mix(in srgb, var(--pc) 25%, #fff);padding:0;overflow:hidden}
.breeds button img,.breeds button svg{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.breeds button[aria-checked="true"]{box-shadow:0 0 0 3px var(--butter),0 0 0 6px var(--plum)}
.breeds button:disabled{opacity:.3;filter:grayscale(1)}
.online-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.online-actions .or{color:var(--plum-2);font-weight:700}
.join{display:flex;gap:8px;flex:1;min-width:220px}
.join input{margin:0;flex:1;min-width:0}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:6px}
.seat{background:#fff;border:2.5px solid var(--plum);border-radius:var(--r-md);padding:10px 8px;text-align:center;position:relative}
.seat .portrait{width:64px;height:64px;margin:0 auto 6px;cursor:pointer;padding:0}
.seat input{width:100%;font:inherit;font-weight:900;text-align:center;border:2px solid var(--plum);border-radius:999px;padding:.2em .4em;background:#FFF7DA;color:var(--plum);font-size:.9rem}
.seat .x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:1.2rem;font-weight:900;color:var(--plum-2);padding:0 4px}
.seat.add{border-style:dashed;background:transparent;font-weight:900;display:grid;place-items:center;gap:4px;min-height:120px}
.seat.add span{font-family:var(--display);font-size:1.8rem;line-height:1}
.lobby{max-width:760px;display:grid;gap:18px}
.code-card{text-align:center}
.big-code{font-family:var(--display);font-size:clamp(1.8rem,6vw,2.8rem);margin:6px 0 12px;word-break:break-all}
.lobby h2{font-size:1.2rem}
.lobby-seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.lseat{display:grid;justify-items:center;gap:4px;text-align:center;border:2.5px solid transparent;border-radius:var(--r-md);padding:8px}
.lseat.me{border-color:var(--plum);background:#FFF7DA}
.lseat .portrait{width:70px;height:70px}
.lseat small{color:var(--plum-2);font-weight:700;min-height:1.2em}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="overlay"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script src="game.js"></script>
</body>
</html>
