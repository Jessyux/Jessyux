<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages in the sand | Jessy Chappell</title>
<meta name="description" content="Write Jessy a message in the sand, by typing or drawing.">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800&family=Hanken+Grotesk:wght@400;600&family=Shadows+Into+Light&display=swap">
<link rel="stylesheet" href="/a11y/a11y.css">
<link rel="stylesheet" href="/a11y/sand.css">
<script src="/a11y/settings.js"></script>
<script>juxA11y.apply(document.documentElement)</script>
</head>
<body>
<main class="sand-page">
  <a class="sand-back" href="/">Back to the portfolio</a>
  <h1 class="hand">Write me a message in the sand</h1>
  <p class="sand-sub">Say hello, leave a thought, or draw something.</p>

  <form id="sand-form" novalidate>
    <fieldset class="sand-kinds">
      <legend>How would you like to write?</legend>
      <label><input type="radio" name="kind" value="text" checked><span>Type</span></label>
      <label><input type="radio" name="kind" value="draw"><span>Draw</span></label>
    </fieldset>

    <div id="type-box">
      <label class="sand-field" for="sand-text">Your message</label>
      <textarea id="sand-text" class="hand" maxlength="140" rows="3" aria-describedby="sand-count"></textarea>
      <p class="sand-count" id="sand-count">0 of 140</p>
    </div>

    <div id="draw-box" hidden>
      <canvas id="pad" role="img" aria-label="Drawing area. Draw with a mouse, finger or stylus. If that doesn't suit, choose Type instead."></canvas>
      <div class="sand-tools">
        <button type="button" class="sand-btn" id="undo">Undo</button>
        <button type="button" class="sand-btn" id="clear">Clear</button>
        <p id="draw-note" role="status"></p>
      </div>
    </div>

    <label class="sand-field" for="sand-name">First name (optional)
      <input type="text" id="sand-name" maxlength="30" autocomplete="given-name">
    </label>
    <div class="sand-trap" aria-hidden="true"><label>Website <input type="text" id="sand-website" tabindex="-1" autocomplete="off"></label></div>

    <p class="sand-public">Your message is public as soon as you post it. Please don't include personal details.</p>
    <button type="submit" class="sand-btn go" id="post" disabled>Post</button>
    <p class="sand-status" id="post-status" role="status"></p>
  </form>

  <section aria-labelledby="wall-title">
    <h2 id="wall-title">Messages so far</h2>
    <p class="sand-status" id="wall-status" role="status"></p>
    <ul class="wall" id="wall"></ul>
  </section>
</main>
<script src="/a11y/contrast.js"></script>
<script src="/a11y/panel.js"></script>
<script>juxPanel.mount({view:'sand',showFloatingButton:true})</script>
<script src="/a11y/sand.js"></script>
</body>
</html>
